            mkdir -p "$RUNNER_TEMP/inventura-project"
            unzip -q "$RUNNER_TEMP/inventura-project.zip" -d "$RUNNER_TEMP/inventura-project"
            cp -R "$RUNNER_TEMP/inventura-project/inventura_android_project/android" ./android

      - name: Nastavení Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Nastavení Android SDK
        uses: android-actions/setup-android@v3

      - name: Sestavení instalačního APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Uložení APK ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: Inventura-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
